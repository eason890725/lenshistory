spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lenshistory
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: always
server:
  port: 8083
  address: 0.0.0.0
